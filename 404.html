<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Event Management</title>
    <link rel="icon" href="assets/images/brand-logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/404.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <!--- 404 Page --->
    <main class="em-404">
        <div class="em-404-glow em-404-glow-one"></div>
        <div class="em-404-glow em-404-glow-two"></div>
        <div class="em-404-grid"></div>
        <!--- Floating Elements --->
        <div class="em-404-floating em-404-floating-one"><i class="bi bi-stars"></i></div>
        <div class="em-404-floating em-404-floating-two"><i class="bi bi-calendar-event"></i></div>
        <div class="em-404-floating em-404-floating-three"><i class="bi bi-ticket-perforated"></i></div>
        <div class="container">
            <div class="em-404-content">
                <!--- Logo --->
                <a href="index.html" class="em-404-logo">
                    <img src="assets/images/brand-logo.webp" alt="Event Management Logo">
                </a>
                <!--- Error Visual --->
                <div class="em-404-number-wrap">
                    <span class="em-404-number">4</span>
                    <div class="em-404-center">
                        <div class="em-404-orbit em-404-orbit-one"></div>
                        <div class="em-404-orbit em-404-orbit-two"></div>
                        <div class="em-404-center-icon"><i class="bi bi-calendar-event"></i></div>
                    </div>
                    <span class="em-404-number">4</span>
                </div>
                <!--- Error Content --->
                <span class="em-404-label">Oops! Event not found</span>
                <h1 class="em-404-title">This page missed<br><span>the main event.</span></h1>
                <p class="em-404-text">The page you're looking for may have moved, been removed, or never existed in the first place.</p>
                <!--- Action Buttons --->
                <div class="em-404-actions">
                    <button type="button" class="em-404-back-btn" id="em404BackBtn">
                        <i class="bi bi-arrow-left"></i>
                        <span>Go Back</span>
                    </button>
                    <a href="index.html" class="em-404-home-btn">
                        <span>Go Home</span>
                        <i class="bi bi-arrow-up-right"></i>
                    </a>
                </div>
                <!--- Status --->
                <div class="em-404-status">
                    <span class="em-404-status-line"></span>
                    <span>404 / PAGE NOT FOUND</span>
                    <span class="em-404-status-line"></span>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/js/404.js"></script>
</body>
</html>
